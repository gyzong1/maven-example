# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven
#
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support documentation.

name: Java CI with Maven

on:
  push:
    branches: ["master"]
  # pull_request:
  #   branches: ["master"]

permissions:
  contents: read
  id-token: write

jobs:
  oidc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Project 1 ----
      - name: Setup JFrog CLI (project1)
        id: setup-jfrog-cli
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://demo.jfrogchina.com
          JF_PROJECT: guoyz-project
          JFROG_CLI_BUILD_PROJECT: guoyz-project
        with:
          oidc-provider-name: guoyz-test
          oidc-audience: guoyz-test
          custom-server-id: project1

      - name: Debug OIDC token (project1)
        run: |
          TOKEN='${{ steps.setup-jfrog-cli.outputs.oidc-token }}'
          USER='${{ steps.setup-jfrog-cli.outputs.oidc-user }}'
          echo "user length: ${#USER}"
          echo "token length: ${#TOKEN}"
          echo "user (base64): $(printf '%s' "$USER" | base64)"
          echo "token (base64): $(printf '%s' "$TOKEN" | base64)"

      - name: Use project1
        run: |
          jf c use project1
          jf rt ping
          ls
          jf rt dl guoyz-project-generic-local/1.txt --flat=true

      # 清掉第一次写入 GITHUB_ENV 的项目上下文，避免污染第二次 OIDC
      - name: Reset project env before project2
        run: |
          echo "JFROG_CLI_BUILD_PROJECT=guoyz-project2" >> "$GITHUB_ENV"
          echo "JF_PROJECT=guoyz-project2" >> "$GITHUB_ENV"

      # ---- Project 2 ----
      - name: Setup JFrog CLI (project2)
        id: setup-jfrog-cli-2
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://demo.jfrogchina.com
          JF_PROJECT: guoyz-project2
          # 必须显式覆盖，否则会沿用第一次的 guoyz-project
          JFROG_CLI_BUILD_PROJECT: guoyz-project2
        with:
          oidc-provider-name: guoyz-project2
          oidc-audience: guoyz-project2
          custom-server-id: project2

      - name: Debug OIDC token (project2)
        run: |
          TOKEN='${{ steps.setup-jfrog-cli-2.outputs.oidc-token }}'
          USER='${{ steps.setup-jfrog-cli-2.outputs.oidc-user }}'
          echo "user length: ${#USER}"
          echo "token length: ${#TOKEN}"
          echo "user (base64): $(printf '%s' "$USER" | base64)"
          echo "token (base64): $(printf '%s' "$TOKEN" | base64)"

      - name: Use project2
        run: |
          jf c use project2
          jf rt ping
